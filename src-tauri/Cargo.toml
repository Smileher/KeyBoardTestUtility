[package]
name = "keyboard-test-utility"
version = "3.0.0"
description = "A portable keyboard and mouse input tester"
authors = ["Smileher"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Storage_Packaging_Appx", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
